name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and lint
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Verify native libraries and APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|x86_64)/libxilon_native.so"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: xilon-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
